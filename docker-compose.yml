services:
  opensearch:
    image: opensearchproject/opensearch:3.8.0
    environment:
      - cluster.name=corex-logging
      - node.name=opensearch
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD}
    ulimits:
      memlock: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ${OPENSEARCH_DATA_DIR:-opensearch-data}:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sk -o /dev/null https://localhost:9200/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    networks:
      - logging-net

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.8.0
    volumes:
      - ./opensearch-dashboards/opensearch_dashboards.yml:/usr/share/opensearch-dashboards/config/opensearch_dashboards.yml:ro
    environment:
      - OPENSEARCH_HOSTS=https://opensearch:9200
      - OPENSEARCH_USERNAME=admin
      - OPENSEARCH_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD}
      - SERVER_HOST=0.0.0.0
    ports:
      - "5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - logging-net

  opensearch-mcp:
    container_name: opensearch-mcp
    hostname: opensearch-mcp
    image: opensearch-mcp:0.11.0
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.13-slim
        RUN pip install --no-cache-dir opensearch-mcp-server-py==0.11.0
        ENTRYPOINT ["python", "-m", "mcp_server_opensearch"]
    command: --transport stream --host 0.0.0.0 --port 9900 --log-format json --debug
    env_file: [.env]
    environment:
      - OPENSEARCH_URL=${OPENSEARCH_URL:-https://opensearch:9200}
      - OPENSEARCH_USERNAME=${OPENSEARCH_USERNAME:-admin}
      - OPENSEARCH_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD}
      - OPENSEARCH_SETTINGS_ALLOW_WRITE=false
      - OPENSEARCH_SSL_VERIFY=false
    depends_on:
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('localhost', 9900), timeout=3); s.close()\""]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - logging-net
      - corex-net

networks:
  logging-net:
    driver: bridge
  corex-net:
    external: true
    name: ${COREX_NETWORK_NAME:-haproxy_manager_corex-net}

volumes:
  opensearch-data:
    # Only used when OPENSEARCH_DATA_DIR is not set. When a host path is
    # provided (e.g. /mnt/nsf-volume/opensearch), it's used directly as a
    # bind mount and this named volume is never referenced.
